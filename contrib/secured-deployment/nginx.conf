access_log off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map "$request_method:$oauth_scope" $scope_authorized {
    default 0;
    "~^GET:(?:.*[, ])?(?:read|write):jobs(?:[, ].*)?$" 1;
    "~^PUT:(?:.*[, ])?write:jobs(?:[, ].*)?$" 1;
}

server {
    listen 8443 ssl;
    server_name wfx-mgmt.localhost;

    ssl_certificate @STATE@/certs/cert.pem;
    ssl_certificate_key @STATE@/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_ignore_headers X-Accel-Redirect;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Redirect $scheme://$host:$server_port$request_uri;
    }

    location = /_oauth2_auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location = /_token_audience/wfx-northbound-api {
        internal;
        return 204;
    }

    location ^~ /_token_audience/ {
        internal;
        return 403 "Forbidden: Token audience mismatch";
    }

    # fallback: block unknown API routes
    location /api/ {
        return 403 "Forbidden: Unknown API endpoint";
    }

    # public endpoints
    location = /health {
        try_files $uri @northbound;
    }
    location = /version {
        try_files $uri @northbound;
    }
    location ~ ^/api/wfx/v1/(health|version|openapi.json|swagger.json)$ {
        try_files $uri @northbound;
    }

    location /api/wfx/v1/workflows {
        auth_request /_oauth2_auth;
        error_page 403 = @forbidden;
        try_files $uri @northbound;
    }

    location /api/wfx/v1/jobs {
        auth_request /_oauth2_auth;
        error_page 403 = @forbidden;
        try_files $uri @northbound;
    }

    location = / {
        return 302 /ui/;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location @northbound {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Id "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location @forbidden {
        return 403 "Forbidden: Access denied";
    }
}

server {
    listen 8443 ssl;
    server_name wfx.localhost;

    ssl_certificate @STATE@/certs/cert.pem;
    ssl_certificate_key @STATE@/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /_oauth2_auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location = /_token_audience/wfx-southbound-api {
        internal;
        return 204;
    }

    location ^~ /_token_audience/ {
        internal;
        return 403 "Forbidden: Token audience mismatch";
    }

    # fallback: block all routes
    location / {
        return 403 "Forbidden: Unknown endpoint";
    }

    # public endpoints
    location = /health {
        try_files $uri @southbound;
    }
    location = /version {
        try_files $uri @southbound;
    }
    location ~ ^/api/wfx/v1/(health|version|openapi.json|swagger.json)$ {
        try_files $uri @southbound;
    }

    location /api/wfx/v1/workflows {
        return 403 "Forbidden: Workflows endpoint disabled";
    }

    # client-specific: JWT + client ID claim + jobs scope
    location /api/wfx/v1/jobs {
        auth_request /_oauth2_auth;
        error_page 403 = @forbidden;
        auth_request_set $client_id $upstream_http_x_client_id;
        auth_request_set $oauth_scope $upstream_http_x_oauth_scope;
        # content-phase jump so $client_id / $oauth_scope from auth_request are set
        try_files $uri @southbound_jobs;
    }

    location @southbound_jobs {
        if ($client_id = "") {
            return 403 "Forbidden: No client ID in token";
        }
        if ($scope_authorized = 0) {
            return 403 "Forbidden: Invalid scope for this HTTP method";
        }
        try_files $uri @southbound;
    }

    location @southbound {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Id $client_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location @forbidden {
        return 403 "Forbidden: Access denied";
    }
}

server {
    listen 8443 ssl;
    server_name authelia.localhost;

    ssl_certificate @STATE@/certs/cert.pem;
    ssl_certificate_key @STATE@/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        add_header Access-Control-Allow-Origin "https://wfx-mgmt.localhost:8443" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:9091;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
