---
server:
  bindAddress: 127.0.0.1:4180

upstreamConfig:
  upstreams:
    - id: static
      path: /
      static: true
      staticCode: 202

injectResponseHeaders:
  - name: X-Client-Id
    values:
      - claimSource:
          claim: https://siemens.github.io/wfx/client-id
  - name: X-Accel-Redirect
    values:
      - claimSource:
          claim: aud
          prefix: /_token_audience/
  - name: X-OAuth-Scope
    values:
      - claimSource:
          claim: scp

providers:
  - id: authelia
    provider: oidc
    clientID: wfx-proxy
    clientSecretFile: '@STATE@/oauth2-client-secret'
    code_challenge_method: S256
    scope: openid profile email groups read:jobs write:jobs
    allowedGroups:
      - wfx
    caFiles:
      - '@STATE@/certs/ca.pem'
    oidcConfig:
      issuerURL: https://authelia.localhost:8443
      insecureSkipNonce: false
      extraAudiences:
        - wfx-northbound-api
        - wfx-southbound-api
      enabledSigningAlgs:
        - RS256
    skipClaimsFromProfileURL: true
    additionalClaims:
      - aud
      - scp
      - https://siemens.github.io/wfx/client-id
